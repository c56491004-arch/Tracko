<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardKeep</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f7f6f3;--surface:#fff;--surface2:#f2f1ed;--border:#e5e3dc;
    --text:#1a1917;--text2:#6b6960;--text3:#a09d94;--accent:#1a1917;
    --green:#2d6a4f;--green-bg:#d8f3dc;--orange:#b5451b;--orange-bg:#fde8e0;
    --blue:#1a4f8a;--blue-bg:#dbeafe;--red:#991b1b;--red-bg:#fee2e2;
    --radius:12px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .app{max-width:480px;margin:0 auto;padding:0 0 80px;min-height:100vh;}
  .header{padding:24px 20px 12px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:20px;font-weight:600;letter-spacing:-.5px;}
  .logo span{color:var(--text3);font-weight:400;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .country-badge{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--text2);transition:background .15s;}
  .country-badge:hover{background:var(--surface2);}
  .notif-btn{width:34px;height:34px;border-radius:99px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(247,246,243,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 0 12px;z-index:100;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 0;color:var(--text3);transition:color .15s;}
  .nav-btn.active{color:var(--text);}
  .nav-btn svg{width:22px;height:22px;}
  .nav-btn span{font-size:11px;font-weight:500;}
  .section{display:none;padding:0 20px;}
  .section.active{display:block;}
  .sec-title{font-size:13px;font-weight:500;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin:16px 0 10px;}
  .card-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .card-item:hover{border-color:var(--text3);box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .card-chip{width:44px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .card-info{flex:1;}
  .card-name{font-size:15px;font-weight:600;}
  .card-meta{font-size:12px;color:var(--text2);margin-top:2px;}
  .expiry-warn{font-size:11px;background:var(--orange-bg);color:var(--orange);padding:3px 9px;border-radius:99px;font-weight:500;white-space:nowrap;}
  .sub-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .sub-chip{font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:3px 10px;color:var(--text2);}
  .card-total{font-size:12px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-weight:500;}
  .add-card-btn{width:100%;padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius);background:transparent;color:var(--text3);font-size:14px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;margin-top:4px;}
  .add-card-btn:hover{border-color:var(--text3);color:var(--text2);background:var(--surface);}
  .svc-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .svc-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .svc-logo{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid var(--border);}
  .svc-info{min-width:0;}
  .svc-name{font-size:14px;font-weight:600;}
  .svc-sub{font-size:12px;color:var(--text2);margin-top:1px;}
  .svc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .svc-amt{font-size:13px;font-weight:600;white-space:nowrap;}
  .svc-cycle{font-size:11px;color:var(--text3);}
  .go-btn{font-size:12px;padding:4px 12px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all .15s;font-family:inherit;}
  .go-btn:hover{background:var(--accent);color:white;border-color:var(--accent);}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .stat-label{font-size:12px;color:var(--text2);margin-bottom:6px;}
  .stat-val{font-size:24px;font-weight:600;letter-spacing:-.5px;}
  .stat-val.warn{color:var(--orange);}
  .alert-card{background:var(--orange-bg);border:1px solid #f5c6b0;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .alert-title{font-size:13px;font-weight:600;color:var(--orange);margin-bottom:4px;}
  .alert-body{font-size:13px;color:var(--orange);line-height:1.5;}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
  .b-ok{background:var(--green-bg);color:var(--green);}
  .b-warn{background:var(--orange-bg);color:var(--orange);}
  .b-no{background:var(--red-bg);color:var(--red);}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px 32px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;}
  .handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 20px;}
  .modal-title{font-size:18px;font-weight:600;margin-bottom:20px;}
  .fg{margin-bottom:16px;}
  .fl{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;font-weight:500;}
  .fi{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s;}
  .fi:focus{border-color:var(--accent);}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .type-tog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .type-btn{padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;font-size:14px;font-family:inherit;cursor:pointer;color:var(--text2);transition:all .15s;font-weight:500;}
  .type-btn.active{background:var(--accent);color:white;border-color:var(--accent);}
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
  .svc-chip{padding:8px 4px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;text-align:center;cursor:pointer;color:var(--text2);background:transparent;font-family:inherit;transition:all .15s;line-height:1.3;}
  .svc-chip.sel{border-color:var(--accent);background:var(--accent);color:white;}
  .cat-lbl{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-save{flex:1;padding:14px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;}
  .btn-cancel{padding:14px 18px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;cursor:pointer;color:var(--text2);}
  .country-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .c-opt{padding:16px;border:1px solid var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;transition:all .15s;background:transparent;font-family:inherit;}
  .c-opt:hover{border-color:var(--text3);background:var(--surface2);}
  .c-opt.sel{border-color:var(--accent);background:var(--surface2);}
  .c-flag{font-size:28px;display:block;margin-bottom:6px;}
  .c-name{font-size:14px;font-weight:600;color:var(--text);}
  .detail-view{display:none;position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto;max-width:480px;margin:0 auto;}
  .detail-view.open{display:block;}
  .detail-hdr{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;}
  .back-btn{width:36px;height:36px;border-radius:99px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .d-chip{width:48px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .d-name{font-size:16px;font-weight:600;}
  .d-meta{font-size:13px;color:var(--text2);}
  .detail-body{padding:20px;}
  .d-svc-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .empty{text-align:center;padding:48px 20px;color:var(--text2);}
  .empty-icon{font-size:40px;margin-bottom:12px;}
  .empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .empty-sub{font-size:14px;line-height:1.5;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:10px 20px;border-radius:99px;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;}
  .hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .custom-row{display:flex;gap:8px;margin-top:8px;}
  .btn-add-c{padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;color:var(--text2);white-space:nowrap;transition:all .15s;}
  .btn-add-c:hover{background:var(--accent);color:white;border-color:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">Card<span>Keep</span></div>
    <div class="header-right">
      <button class="notif-btn" onclick="requestNotif()" title="만료 알림 설정">🔔</button>
      <button class="country-badge" onclick="openCountry()" id="countryBadge">🇦🇺 호주</button>
    </div>
  </div>

  <div class="section active" id="sec-cards">
    <div class="sec-title">내 카드 / 계좌</div>
    <div id="cardList"></div>
    <button class="add-card-btn" onclick="openAdd()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      카드 / 계좌 추가
    </button>
  </div>

  <div class="section" id="sec-services">
    <div class="sec-title">전체 구독 / 자동이체</div>
    <div id="svcList"></div>
  </div>

  <div class="section" id="sec-summary">
    <div class="sec-title">요약</div>
    <div class="stats-grid" id="statsGrid"></div>
    <div id="alertArea"></div>
    <div id="summaryList"></div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('cards',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span>카드</span>
    </button>
    <button class="nav-btn" onclick="switchTab('services',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 10h16M4 14h10"/></svg>
      <span>구독</span>
    </button>
    <button class="nav-btn" onclick="switchTab('summary',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>요약</span>
    </button>
  </nav>
</div>

<!-- Add Card Sheet -->
<div class="overlay" id="addModal">
  <div class="sheet">
    <div class="handle"></div>
    <div class="modal-title">카드 / 계좌 추가</div>
    <div class="type-tog">
      <button class="type-btn active" onclick="setType('card',this)">💳 카드</button>
      <button class="type-btn" onclick="setType('account',this)">🏦 계좌</button>
    </div>
    <div class="fg"><label class="fl">이름</label><input class="fi" id="iName" placeholder="예: 내 신한카드"/></div>
    <div class="frow">
      <div class="fg"><label class="fl">뒷 4자리 (선택)</label><input class="fi" id="iLast4" placeholder="1234" maxlength="4"/></div>
      <div class="fg" id="expiryGrp"><label class="fl">유효기간</label><input class="fi" id="iExpiry" placeholder="MM/YY" maxlength="5"/></div>
    </div>
    <div class="fg">
      <label class="fl">색상</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="cdot sel" style="width:28px;height:28px;border-radius:99px;background:#1a1917;cursor:pointer;border:2px solid #1a1917;" data-color="#1a1917" onclick="pickColor(this)"></div>
        <div class="cdot" style="width:28px;height:28px;border-radius:99px;background:#1a4f8a;cursor:pointer;border:2px solid transparent;" data-color="#1a4f8a" onclick="pickColor(this)"></div>
        <div class="cdot" style="width:28px;height:28px;border-radius:99px;background:#2d6a4f;cursor:pointer;border:2px solid transparent;" data-color="#2d6a4f" onclick="pickColor(this)"></div>
        <div class="cdot" style="width:28px;height:28px;border-radius:99px;background:#7c3aed;cursor:pointer;border:2px solid transparent;" data-color="#7c3aed" onclick="pickColor(this)"></div>
        <div class="cdot" style="width:28px;height:28px;border-radius:99px;background:#b5451b;cursor:pointer;border:2px solid transparent;" data-color="#b5451b" onclick="pickColor(this)"></div>
        <div class="cdot" style="width:28px;height:28px;border-radius:99px;background:#9a7b4f;cursor:pointer;border:2px solid transparent;" data-color="#9a7b4f" onclick="pickColor(this)"></div>
      </div>
    </div>
    <div class="hr"></div>
    <div class="fl" style="margin-bottom:8px;">연결된 서비스</div>
    <div id="svcSelector"></div>
    <div class="hr"></div>
    <div class="fl" style="margin-bottom:3px;">서비스 직접 추가</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">목록에 없는 서비스를 직접 입력해요</div>
    <div class="custom-row">
      <input class="fi" id="iCName" placeholder="서비스 이름" style="padding:10px 12px;font-size:14px;"/>
      <input class="fi" id="iCUrl" placeholder="결제 변경 URL (선택)" style="padding:10px 12px;font-size:14px;flex:1.5;"/>
      <button class="btn-add-c" onclick="addCustom()">추가</button>
    </div>
    <div id="customList" style="margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAdd()">취소</button>
      <button class="btn-save" onclick="saveCard()">저장</button>
    </div>
  </div>
</div>

<!-- Amount Sheet -->
<div class="overlay" id="amtModal">
  <div class="sheet" style="max-height:60vh;">
    <div class="handle"></div>
    <div class="modal-title" id="amtTitle">금액 / 결제일</div>
    <div class="fg"><label class="fl">월 금액</label><input class="fi" id="iAmt" placeholder="예: 17000" type="number"/></div>
    <div class="fg"><label class="fl">매월 결제일</label><input class="fi" id="iDay" placeholder="예: 14" type="number" min="1" max="31"/></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAmt()">취소</button>
      <button class="btn-save" onclick="saveAmt()">저장</button>
    </div>
  </div>
</div>

<!-- Country Sheet -->
<div class="overlay" id="countryModal">
  <div class="sheet" style="max-height:60vh;">
    <div class="handle"></div>
    <div class="modal-title">국가 선택</div>
    <div class="country-grid">
      <button class="c-opt sel" data-country="au" onclick="selectCountry('au',this)"><span class="c-flag">🇦🇺</span><span class="c-name">호주</span></button>
      <button class="c-opt" data-country="kr" onclick="selectCountry('kr',this)"><span class="c-flag">🇰🇷</span><span class="c-name">한국</span></button>
    </div>
    <button class="btn-save" style="width:100%;margin-top:16px;" onclick="closeCountry()">완료</button>
  </div>
</div>

<!-- Detail View -->
<div class="detail-view" id="detailView">
  <div class="detail-hdr">
    <button class="back-btn" onclick="closeDetail()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="d-chip" id="dChip"></div>
    <div><div class="d-name" id="dName"></div><div class="d-meta" id="dMeta"></div></div>
    <button class="btn-cancel" style="margin-left:auto;padding:6px 14px;font-size:13px;" onclick="deleteCard()">삭제</button>
  </div>
  <div class="detail-body">
    <div class="sec-title" style="margin-top:0;">연결된 서비스</div>
    <div id="detailSvcs"></div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:13px;color:var(--text2);line-height:1.6;margin-top:8px;">
      <strong style="color:var(--text)">이동 ↗</strong> 버튼으로 각 서비스 결제 변경 페이지로 바로 이동할 수 있어요.
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SVCS = {
  au:{
    '스트리밍':[
      {id:'netflix',name:'넷플릭스',logo:'N',bg:'#141414',color:'#fff',url:'https://www.netflix.com/account/payment',note:'직접 연결'},
      {id:'spotify',name:'Spotify',logo:'SP',bg:'#1db954',color:'#fff',url:'https://www.spotify.com/au/account/subscription/change-payment-method',note:'직접 연결'},
      {id:'youtube',name:'유튜브',logo:'YT',bg:'#ff0000',color:'#fff',url:'https://pay.google.com/gp/w/u/0/home/paymentmethods',note:'Google 경유'},
      {id:'appletv',name:'Apple TV+',logo:'AP',bg:'#000',color:'#fff',url:'https://appleid.apple.com/account/manage',note:'Apple ID 경유'},
      {id:'stan',name:'Stan',logo:'St',bg:'#0056d2',color:'#fff',url:'https://www.stan.com.au/account/billing',note:'직접 연결'},
      {id:'binge',name:'Binge',logo:'Bg',bg:'#ff5500',color:'#fff',url:'https://www.binge.com.au/account',note:'직접 연결'},
      {id:'amazon',name:'Amazon',logo:'Am',bg:'#ff9900',color:'#fff',url:'https://www.amazon.com.au/cpe/managepaymentmethods',note:'직접 연결'},
    ],
    '공과금':[
      {id:'agl',name:'AGL',logo:'AG',bg:'#1a4f8a',color:'#fff',url:'https://www.agl.com.au/myaccount',note:'직접 연결'},
      {id:'origin',name:'Origin',logo:'Or',bg:'#e65100',color:'#fff',url:'https://www.originenergy.com.au/account',note:'직접 연결'},
      {id:'telstra',name:'Telstra',logo:'Te',bg:'#2d6a4f',color:'#fff',url:'https://www.telstra.com.au/mytelstra',note:'직접 연결'},
      {id:'optus',name:'Optus',logo:'Op',bg:'#c62828',color:'#fff',url:'https://www.optus.com.au/myoptus',note:'직접 연결'},
    ],
    '보험':[

function loadState(){
  try{const s=localStorage.getItem('ck_v3');if(s)return JSON.parse(s);}catch(e){}
  return{country:'au',cards:[
    {id:'c1',type:'card',name:'신한 체크카드',last4:'4521',expiry:'08/26',color:'#1a4f8a',services:['netflix','spotify','youtube'],customServices:[],amounts:{}},
    {id:'c2',type:'card',name:'국민 신용카드',last4:'8847',expiry:'03/28',color:'#2d6a4f',services:['agl','medibank','stan'],customServices:[],amounts:{}},
  ]};
}
function persist(){try{localStorage.setItem('ck_v3',JSON.stringify(S));}catch(e){}}

let S=loadState();
S.cards.forEach(c=>{if(!c.customServices)c.customServices=[];if(!c.amounts)c.amounts={};});

let amtKey=null,detailId=null,selColor='#1a1917',selType='card',selSvcs=[],tempCustom=[];

function allSvcs(){
  const r={};
  Object.entries(SVCS[S.country]).forEach(([cat,list])=>list.forEach(s=>r[s.id]={...s,cat}));
  return r;
}
function expiryWarn(e){
  if(!e)return false;
  const[m,y]=e.split('/');if(!m||!y)return false;
  const exp=new Date(2000+parseInt(y),parseInt(m)-1,1);
  return(exp-new Date())/(1000*60*60*24*30)<3;
}
function fmt(amt){if(!amt)return null;return S.country==='kr'?`₩${Number(amt).toLocaleString()}`:`$${Number(amt).toLocaleString()}`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function badgeClass(note){return note?.includes('불가')?'b-no':note?.includes('경유')||note?.includes('콜센터')?'b-warn':'b-ok';}

// Notifications
function requestNotif(){
  if(!('Notification'in window)){toast('이 브라우저는 알림 미지원');return;}
  if(Notification.permission==='granted'){fireNotifs();toast('✓ 알림 확인 완료');}
  else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(p=>{
      if(p==='granted'){fireNotifs();toast('✓ 알림 허용됐어요!');}
      else toast('알림 권한이 거부됐어요');
    });
  }else toast('브라우저 설정에서 알림을 허용해주세요');
}
function fireNotifs(){
  if(Notification.permission!=='granted')return;
  S.cards.forEach(c=>{
    if(!c.expiry||c.type!=='card')return;
    const[m,y]=c.expiry.split('/');if(!m||!y)return;
    const exp=new Date(2000+parseInt(y),parseInt(m)-1,1);
    const days=Math.ceil((exp-new Date())/(1000*60*60*24));
    if(days>0&&days<=60){
      new Notification('CardKeep ⚠ 카드 만료 임박',{
        body:`${c.name}이 ${days}일 후 만료돼요. 연결된 서비스 결제 수단을 미리 변경하세요!`
      });
    }
  });
}

// Render
function renderCards(){
  const el=document.getElementById('cardList');
  if(!S.cards.length){el.innerHTML=`<div class="empty"><div class="empty-icon">💳</div><div class="empty-title">카드가 없어요</div><div class="empty-sub">아래 버튼을 눌러 추가해보세요</div></div>`;return;}
  const as=allSvcs();
  el.innerHTML=S.cards.map(c=>{
    const warn=expiryWarn(c.expiry);
    const chips=[...c.services.map(id=>as[id]?.name).filter(Boolean),...(c.customServices||[]).map(s=>s.name)].map(n=>`<span class="sub-chip">${n}</span>`).join('');
    const total=[...c.services,...(c.customServices||[]).map(s=>s.id)].reduce((sum,id)=>sum+(Number(c.amounts?.[id]?.amount)||0),0);
    return`<div class="card-item" onclick="openDetail('${c.id}')">
      <div class="card-top">
        <div class="card-chip" style="background:${c.color};">${c.type==='card'?'💳':'🏦'}</div>
        <div class="card-info"><div class="card-name">${c.name}${c.last4?` •••• ${c.last4}`:''}</div><div class="card-meta">${c.type==='card'?`유효기간 ${c.expiry||'미입력'}`:'계좌'}</div></div>
        ${warn?`<span class="expiry-warn">⚠ 곧 만료</span>`:''}
      </div>
      ${chips?`<div class="sub-chips">${chips}</div>`:`<div style="font-size:12px;color:var(--text3);">연결된 서비스 없음</div>`}
      ${total>0?`<div class="card-total">월 합계: ${fmt(total)}</div>`:''}
    </div>`;
  }).join('');
}

function renderServices(){
  const el=document.getElementById('svcList');
  const as=allSvcs();
  const rows=[];
  S.cards.forEach(c=>{
    c.services.forEach(id=>{const s=as[id];if(s)rows.push({...s,cName:c.name,cLast4:c.last4,cId:c.id,amt:c.amounts?.[id]});});
    (c.customServices||[]).forEach(s=>rows.push({...s,cName:c.name,cLast4:c.last4,cId:c.id,amt:c.amounts?.[s.id],note:'직접 추가',bg:'#6b6960',color:'#fff',logo:s.name[0]||'?'}));
  });
  if(!rows.length){el.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">구독 서비스가 없어요</div><div class="empty-sub">카드에 서비스를 연결해보세요</div></div>`;return;}
  el.innerHTML=rows.map(s=>{
    const noCard=s.note?.includes('불가');
    return`<div class="svc-item">
      <div class="svc-left">
        <div class="svc-logo" style="background:${s.bg};color:${s.color};">${s.logo}</div>
        <div class="svc-info">
          <div class="svc-name">${s.name}</div>
          <div class="svc-sub">${s.cName}${s.cLast4?` •••• ${s.cLast4}`:''} · <span class="badge ${badgeClass(s.note)}">${s.note}</span>${s.callNote?` <span style="font-size:11px;color:var(--text3);">${s.callNote}</span>`:''}</div>
        </div>
      </div>
      <div class="svc-right">
        ${s.amt?.amount?`<div class="svc-amt">${fmt(s.amt.amount)}</div>`:''}
        ${s.amt?.day?`<div class="svc-cycle">매월 ${s.amt.day}일</div>`:''}
        <div style="display:flex;gap:4px;">
          <button class="go-btn" onclick="event.stopPropagation();openAmt('${s.cId}','${s.id}','${s.name}')" style="font-size:11px;padding:3px 9px;">금액 ✎</button>
          ${!noCard&&s.url?`<a class="go-btn" href="${s.url}" target="_blank">이동 ↗</a>`:`<span style="font-size:12px;color:var(--text3);">전화 필요</span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderSummary(){
  const as=allSvcs();
  const warnCards=S.cards.filter(c=>expiryWarn(c.expiry));
  const totalSvcs=S.cards.reduce((a,c)=>a+c.services.length+(c.customServices||[]).length,0);
  const totalAmt=S.cards.reduce((sum,c)=>sum+Object.values(c.amounts||{}).reduce((s,a)=>s+(Number(a?.amount)||0),0),0);
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="stat-label">등록 카드 / 계좌</div><div class="stat-val">${S.cards.length}개</div></div>
    <div class="stat-card"><div class="stat-label">구독 서비스</div><div class="stat-val">${totalSvcs}개</div></div>
    <div class="stat-card"><div class="stat-label">월 총 지출</div><div class="stat-val" style="font-size:${totalAmt>0?'18':'24'}px;">${totalAmt>0?fmt(totalAmt):'미입력'}</div></div>
    <div class="stat-card"><div class="stat-label">곧 만료</div><div class="stat-val ${warnCards.length?'warn':''}">${warnCards.length}개</div></div>
  `;
  document.getElementById('alertArea').innerHTML=warnCards.map(c=>{
    const names=[...c.services.map(id=>as[id]?.name).filter(Boolean),...(c.customServices||[]).map(s=>s.name)].join(', ');
    return`<div class="alert-card"><div class="alert-title">⚠ 카드 만료 임박</div><div class="alert-body"><strong>${c.name}</strong>이 곧 만료돼요.<br>${names?`연결 서비스: ${names}`:''}</div></div>`;
  }).join('');
  const summaryEl=document.getElementById('summaryList');
  if(warnCards.length){
    const rows=[];
    warnCards.forEach(c=>{
      c.services.forEach(id=>{const s=as[id];if(s)rows.push({...s,cName:c.name});});
      (c.customServices||[]).forEach(s=>rows.push({...s,cName:c.name,bg:'#6b6960',color:'#fff',logo:s.name[0]}));
    });
    summaryEl.innerHTML=`<div class="sec-title" style="margin-top:16px;">지금 바꿔야 할 서비스</div>`+rows.map(s=>`<div class="svc-item">
      <div class="svc-left"><div class="svc-logo" style="background:${s.bg};color:${s.color};">${s.logo}</div><div class="svc-info"><div class="svc-name">${s.name}</div><div class="svc-sub">${s.cName}</div></div></div>
      ${s.url?`<a class="go-btn" href="${s.url}" target="_blank">변경 ↗</a>`:`<span style="font-size:12px;color:var(--text3);">전화 필요</span>`}
    </div>`).join('');
  }else{summaryEl.innerHTML=`<div style="text-align:center;padding:24px;color:var(--text3);font-size:14px;">만료 임박 카드 없음 ✓</div>`;}
}

function renderAll(){renderCards();renderServices();renderSummary();}

// Tab
function switchTab(name,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  btn.classList.add('active');
  renderAll();
}

// Amount
function openAmt(cId,sId,sName){
  amtKey={cId,sId};
  document.getElementById('amtTitle').textContent=`${sName} 금액 / 결제일`;
  const c=S.cards.find(c=>c.id===cId);
  const ex=c?.amounts?.[sId];
  document.getElementById('iAmt').value=ex?.amount||'';
  document.getElementById('iDay').value=ex?.day||'';
  document.getElementById('amtModal').classList.add('open');
}
function closeAmt(){document.getElementById('amtModal').classList.remove('open');amtKey=null;}
function saveAmt(){
  if(!amtKey)return;
  const c=S.cards.find(c=>c.id===amtKey.cId);
  if(!c)return;
  if(!c.amounts)c.amounts={};
  c.amounts[amtKey.sId]={amount:document.getElementById('iAmt').value,day:document.getElementById('iDay').value};
  persist();closeAmt();renderAll();toast('✓ 저장됐어요');
}

// Detail
function openDetail(id){
  detailId=id;
  const c=S.cards.find(c=>c.id===id);if(!c)return;
  const as=allSvcs();
  document.getElementById('dChip').style.cssText=`background:${c.color};color:#fff;width:48px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;`;
  document.getElementById('dChip').textContent=c.type==='card'?'💳':'🏦';
  document.getElementById('dName').textContent=c.name+(c.last4?` •••• ${c.last4}`:'');
  document.getElementById('dMeta').textContent=c.type==='card'?`유효기간 ${c.expiry||'미입력'}`:'계좌';
  const rows=[...c.services.map(id=>as[id]?{...as[id]}:null).filter(Boolean),...(c.customServices||[]).map(s=>({...s,bg:'#6b6960',color:'#fff',logo:s.name[0],note:'직접 추가'}))];
  document.getElementById('detailSvcs').innerHTML=rows.length?rows.map(s=>{
    const noCard=s.note?.includes('불가');
    const amt=c.amounts?.[s.id];
    return`<div class="d-svc-item">
      <div class="svc-left"><div class="svc-logo" style="background:${s.bg};color:${s.color};">${s.logo}</div>
      <div class="svc-info"><div class="svc-name">${s.name}${amt?.amount?` · ${fmt(amt.amount)}`:''}</div><div class="svc-sub">${s.note||''}${amt?.day?` · 매월 ${amt.day}일`:''}</div></div></div>
      ${!noCard&&s.url?`<a class="go-btn" href="${s.url}" target="_blank">이동 ↗</a>`:`<span style="font-size:12px;color:var(--text3);">전화 필요</span>`}
    </div>`;
  }).join(''):`<div style="font-size:14px;color:var(--text3);padding:16px 0;">연결된 서비스가 없어요</div>`;
  document.getElementById('detailView').classList.add('open');
}
function closeDetail(){document.getElementById('detailView').classList.remove('open');detailId=null;}
function deleteCard(){
  if(!detailId)return;
  if(!confirm('이 카드를 삭제할까요?'))return;
  S.cards=S.cards.filter(c=>c.id!==detailId);
  persist();closeDetail();renderAll();toast('카드가 삭제됐어요');
}

// Add
function openAdd(){
  selColor='#1a1917';selSvcs=[];selType='card';tempCustom=[];
  document.getElementById('iName').value='';
  document.getElementById('iLast4').value='';
  document.getElementById('iExpiry').value='';
  document.getElementById('iCName').value='';
  document.getElementById('iCUrl').value='';
  document.getElementById('customList').innerHTML='';
  document.querySelectorAll('.cdot').forEach(d=>d.style.border=d.dataset.color==='#1a1917'?'2px solid #1a1917':'2px solid transparent');
  document.querySelectorAll('.type-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  document.getElementById('expiryGrp').style.display='';
  buildSvcSelector();
  document.getElementById('addModal').classList.add('open');
}
function closeAdd(){document.getElementById('addModal').classList.remove('open');}
function setType(type,btn){
  selType=type;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('expiryGrp').style.display=type==='card'?'':'none';
}
function pickColor(el){
  selColor=el.dataset.color;
  document.querySelectorAll('.cdot').forEach(d=>d.style.border=d.dataset.color===selColor?`2px solid ${selColor}`:'2px solid transparent');
}
function buildSvcSelector(){
  const cats=SVCS[S.country];
  let html='';
  Object.entries(cats).forEach(([cat,list])=>{
    html+=`<div class="cat-lbl">${cat}</div><div class="svc-grid">`;
    list.forEach(s=>html+=`<button class="svc-chip${selSvcs.includes(s.id)?' sel':''}" onclick="toggleSvc('${s.id}',this)">${s.name}</button>`);
    html+=`</div>`;
  });
  document.getElementById('svcSelector').innerHTML=html;
}
function toggleSvc(id,el){
  const i=selSvcs.indexOf(id);
  if(i>=0)selSvcs.splice(i,1);else selSvcs.push(id);
  el.classList.toggle('sel');
}
function addCustom(){
  const name=document.getElementById('iCName').value.trim();
  if(!name){toast('서비스 이름을 입력해주세요');return;}
  const url=document.getElementById('iCUrl').value.trim();
  tempCustom.push({id:'c_'+Date.now(),name,url});
  document.getElementById('iCName').value='';
  document.getElementById('iCUrl').value='';
  document.getElementById('customList').innerHTML=tempCustom.map((s,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:4px;"><span style="font-size:13px;font-weight:500;">${s.name}${s.url?` <span style='font-size:11px;color:var(--text3);'>(링크 있음)</span>`:''}</span><button onclick="removeCustom(${i})" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;">×</button></div>`).join('');
  toast(`✓ ${name} 추가됨`);
}
function removeCustom(i){tempCustom.splice(i,1);addCustom();document.getElementById('iCName').value='';document.getElementById('iCUrl').value='';}
function saveCard(){
  const name=document.getElementById('iName').value.trim();
  if(!name){document.getElementById('iName').focus();return;}
  S.cards.push({
    id:'c'+Date.now(),type:selType,name,
    last4:document.getElementById('iLast4').value.trim(),
    expiry:selType==='card'?document.getElementById('iExpiry').value.trim():'',
    color:selColor,services:[...selSvcs],customServices:[...tempCustom],amounts:{}
  });
  persist();closeAdd();renderAll();toast('✓ 카드가 추가됐어요');
}

// Country
function openCountry(){document.getElementById('countryModal').classList.add('open');}
function closeCountry(){document.getElementById('countryModal').classList.remove('open');}
function selectCountry(c,el){
  S.country=c;
  document.querySelectorAll('.c-opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('countryBadge').textContent=c==='au'?'🇦🇺 호주':'🇰🇷 한국';
  persist();renderAll();
}

// Init
document.getElementById('countryBadge').textContent=S.country==='au'?'🇦🇺 호주':'🇰🇷 한국';
document.querySelectorAll('.c-opt').forEach(o=>o.classList.toggle('sel',o.dataset.country===S.country));
renderAll();
if(Notification.permission==='granted')setTimeout(fireNotifs,1000);
